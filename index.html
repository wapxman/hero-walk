<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Duel Arena · лесная арена</title>
<style>
  * { margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#0c1017; touch-action:none; }
  canvas { display:block; width:100vw; height:100dvh; }
  #hud { display:none; }
  #hud0 {
    position:fixed; top:12px; left:14px; color:#d5dfd0; z-index:5;
    font:13px/1.5 system-ui, sans-serif; text-shadow:0 1px 4px #000, 0 0 8px #000; pointer-events:none;
  }
  #hud b { color:#fff; }
  #pad { color:#9df0a6; display:none; }
  #snd { color:#ffd28a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>Duel Arena</b> · <span id="tip">стик — движение, кнопки справа — огонь и скилы (ПК: WASD, пробел, Q E F R, фласки 1–4, Enter — волна, B — магазин)</span><br>
<span id="snd">🔇 коснитесь экрана, чтобы включить звук</span> <span id="pad">🎮 геймпад подключён</span></div>
<script src="data.js?v=54"></script>
<script src="chars/atlas.js?v=54"></script>
<script src="chars/villains.js?v=54"></script>
<script>
const V = '?v=54';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
// Чёткость: холст рисуется не больше чем в 2 точки на точку экрана. Если телефон не успевает
// (средний кадр дольше 20 мс две секунды подряд), чёткость понижается ступенями до 1.25 и обратно не растёт.
let DPR = 1, DPR_CAP = 2, W = 0, H = 0, VIG = null;
function resize() {
  DPR = Math.min(DPR_CAP, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  VIG = null;
}
window.addEventListener('resize', resize); resize();
const perf = { t: 0, n: 0, skip: 3 };
function perfTick(dt) {
  if (perf.skip > 0) { perf.skip -= dt; return; }   // первые секунды картинки загружаются в видеопамять — не считаем
  perf.t += dt; perf.n++;
  if (perf.t < 2) return;
  const avg = perf.t / perf.n; perf.t = 0; perf.n = 0;
  if (avg > 0.02 && DPR > 1.25) { DPR_CAP = Math.max(1.25, DPR - 0.375); resize(); perf.skip = 1; }
}

// ---------- мир ----------
const CH = 170;                          // рост героини в единицах мира

// ---------- героиня ----------
const META = {
  front: { frames: 19, w: 161, h: 300, cycle: 1.542 },
  side:  { frames: 15, w: 184, h: 300, cycle: 1.208 },
};
// Бег: лист 8×8, ряд = направление, столбец = кадр. Ряды идут по часовой
// стрелке на экране, начиная с «вниз»: 0 вниз, 1 вниз-влево, 2 влево,
// 3 вверх-влево, 4 вверх, 5 вверх-вправо, 6 вправо, 7 вниз-вправо.
const RUN = { w: 256, h: 256, ax: 128, ay: 201.7, stand: 175.8, frames: 8, cycle: 0.667 };
const RUN_AT = 0.6;      // наклон стика, с которого шаг переходит в бег
const WALK_SPEED = 105, RUN_SPEED = 260;   // единиц мира в секунду
function runRow(ax, ay) {
  // угол на экране (ось Y вниз): вниз = 90°, влево = 180°, вверх = 270°
  const deg = Math.atan2(ay, ax) * 180 / Math.PI;
  return ((Math.round((deg - 90) / 45) % 8) + 8) % 8;
}


// Свечение: [цвет, высота центра от верха спрайта (доля), радиус, мерцание]
const GLOW = {
  braz1: ['255,150,50', 0.16, 95, 1], braz2: ['255,150,50', 0.16, 95, 1],
  lan1: ['255,215,110', 0.62, 55, 0.4], lan2: ['255,215,110', 0.55, 55, 0.4],
  obelisk: ['90,255,130', 0.45, 150, 0.25], obelisk2: ['90,255,130', 0.39, 170, 0.25], portal2: ['255,80,40', 0.52, 190, 0.3],
  cryG: ['120,255,90', 0.5, 80, 0.25], cryS: ['120,255,90', 0.5, 45, 0.25],
  shrine: ['90,170,255', 0.42, 130, 0.25],
};

// Объекты карты: набор по умолчанию лежит в data.js; карта, сохранённая в редакторе, его заменяет
const CFG = loadCfg();
const OBJ = (CFG.map || DEFAULT_OBJ).map(o => Object.assign({ k: 1, ay: 0.93, a: 1 }, o));

// ---------- картинки ----------
// земля и только те листы предметов, которые есть на карте
const img = {};
let loaded = 0;
const FILES = { ground: GROUND };
for (const o of OBJ.concat(FLAT, FRONT)) { const sh = SPR[o.s][0]; FILES[sh] = SHEET_FILES[sh]; }
// листы прежней героини Лиры (около 24 МБ в памяти) нужны только по адресу с #lira
const LIRA = location.hash.indexOf('lira') >= 0;
if (LIRA) Object.assign(FILES, { front: 'front.png', side: 'side.png', run: 'run.webp' });
const TOTAL = Object.keys(FILES).length;
for (const k in FILES) {
  img[k] = new Image();
  img[k].onload = () => { loaded++; };
  img[k].src = FILES[k] + V;
}

// невидимые препятствия из объектов
const SOLID = [];
for (const o of OBJ) {
  if (o.r) SOLID.push({ x: o.x, y: o.y, rx: o.r[0], ry: o.r[1] });
  if (o.c) for (const c of o.c) SOLID.push({ x: o.x + c[0], y: o.y + c[1], rx: c[2], ry: c[3] });
}

// красная версия листов для правой базы: синие пиксели перекрашиваются в красные
function makeRed(image) {
  const c = document.createElement('canvas');
  c.width = image.width; c.height = image.height;
  const x = c.getContext('2d');
  x.drawImage(image, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    if (b > r + 25 && b > g) { p[i] = b; p[i + 1] = g * 0.45; p[i + 2] = r * 0.5; }
  }
  x.putImageData(d, 0, 0);
  return c;
}

// ---------- игрок ----------
const P = {
  x: HERO_SPAWN.x, y: HERO_SPAWN.y,
  dir: 'front', flip: false, moving: false, running: false, row: 0,
  animT: 0, idleT: 0,
};
const cam = { x: 0, y: 0, ready: false };

// ---------- управление: клавиатура ----------
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- управление: виртуальный стик ----------
const stick = { active: false, id: null, x0: 0, y0: 0, dx: 0, dy: 0 };
// стик как в референсе: резное кольцо слева внизу; касание в любом свободном месте переносит его под палец
const stickR = () => Math.min(H, W * 0.56) * 0.135;          // радиус кольца на экране
const stickHome = () => ({ x: Math.min(H, W * 0.56) * 0.25 + stickR() * 0.1, y: H - Math.min(H, W * 0.56) * 0.2 });
addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (window.COMBAT_READY && touchButtonDown(t)) continue;
    if (stick.active || (typeof SHOP !== 'undefined' && SHOP.paused)) continue;
    stick.active = true; stick.id = t.identifier;
    stick.x0 = t.clientX; stick.y0 = t.clientY; stick.dx = 0; stick.dy = 0;
  }
}, { passive: true });
addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === stick.id) {
      const R = stickR() * 0.62;
      stick.dx = Math.max(-R, Math.min(R, t.clientX - stick.x0)) / R;
      stick.dy = Math.max(-R, Math.min(R, t.clientY - stick.y0)) / R;
    }
  }
}, { passive: true });
function stickEnd(e) {
  for (const t of e.changedTouches) {
    if (window.COMBAT_READY && touchButtonUp(t)) continue;
    if (t.identifier === stick.id) { stick.active = false; stick.id = null; stick.dx = 0; stick.dy = 0; }
  }
}
addEventListener('touchend', stickEnd, { passive: true });
addEventListener('touchcancel', stickEnd, { passive: true });

// ---------- геймпад ----------
// Геймпады опрашиваются один раз за кадр, список PADS читают и бой, и магазин.
// Крестовина — фласки (shop.js), ходьба — левым стиком: раньше крестовина делала и то и другое сразу.
const padEl = document.getElementById('pad');
let PADS = [];
const dz = v => Math.abs(v) > 0.25 ? v : 0;
function padPoll() {
  PADS = [];
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const g of gps) if (g) PADS.push(g);
  if (PADS.length && padEl.style.display !== 'inline') padEl.style.display = 'inline';
}
function padAxes() {
  for (const g of PADS) {
    const ax = dz(g.axes[0] || 0), ay = dz(g.axes[1] || 0);
    if (ax || ay) return { ax, ay };
  }
  return null;
}

function inputVector() {
  let ax = 0, ay = 0;
  if (keys.ArrowLeft || keys.KeyA) ax -= 1;
  if (keys.ArrowRight || keys.KeyD) ax += 1;
  if (keys.ArrowUp || keys.KeyW) ay -= 1;
  if (keys.ArrowDown || keys.KeyS) ay += 1;
  if ((ax || ay) && (keys.ShiftLeft || keys.ShiftRight)) { ax *= 0.5; ay *= 0.5; }
  if (stick.active) { ax = stick.dx; ay = stick.dy; }
  const gp = padAxes();
  if (gp) { ax = gp.ax; ay = gp.ay; }
  const m = Math.hypot(ax, ay);
  if (m > 1) { ax /= m; ay /= m; }
  return { ax, ay, m: Math.min(1, m) };
}

// ---------- столкновения ----------
// граница поляны — многоугольник WALK из data.js
function inWalk(x, y) {
  let ins = false;
  for (let i = 0, j = WALK.length - 1; i < WALK.length; j = i++) {
    const a = WALK[i], b = WALK[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) ins = !ins;
  }
  return ins;
}
// вышедшего за край ставим на ближайшую точку края, чуть внутрь
function toWalk(e) {
  let bx = e.x, by = e.y, bd = 1e18, nx = 0, ny = 0;
  for (let i = 0, j = WALK.length - 1; i < WALK.length; j = i++) {
    const a = WALK[j], b = WALK[i], dx = b[0] - a[0], dy = b[1] - a[1];
    const t = Math.max(0, Math.min(1, ((e.x - a[0]) * dx + (e.y - a[1]) * dy) / (dx * dx + dy * dy)));
    const px = a[0] + dx * t, py = a[1] + dy * t, d = (e.x - px) ** 2 + (e.y - py) ** 2;
    if (d < bd) { bd = d; bx = px; by = py; nx = px - e.x; ny = py - e.y; }
  }
  const m = Math.hypot(nx, ny) || 1;
  e.x = bx + nx / m * 0.5; e.y = by + ny / m * 0.5;
}
const PR = [16, 11];   // «толщина» героини у земли
function collide(e) {
  e = e || P;
  for (let pass = 0; pass < 2; pass++) {
    for (const s of SOLID) {
      const rx = s.rx + PR[0], ry = s.ry + PR[1];
      const dx = (e.x - s.x) / rx, dy = (e.y - s.y) / ry;
      const d2 = dx * dx + dy * dy;
      if (d2 < 1) {
        const d = Math.sqrt(d2) || 0.001;
        e.x = s.x + dx / d * rx;
        e.y = s.y + dy / d * ry;
      }
    }
    if (!inWalk(e.x, e.y)) toWalk(e);
  }
}

// ---------- рисование ----------
function sprRect(o) {
  const s = SPR[o.s];
  const w = s[3] * o.k, h = s[4] * o.k;
  return { s, w, h, x: o.x - w / 2, y: o.y - h * o.ay };
}
function drawObj(o, red) {
  const r = sprRect(o);
  const sheet = (o.red && red[r.s[0]]) || img[r.s[0]];
  ctx.globalAlpha = o.a;
  if (o.f) {
    ctx.save(); ctx.translate(o.x, 0); ctx.scale(-1, 1);
    ctx.drawImage(sheet, r.s[1], r.s[2], r.s[3], r.s[4], -r.w / 2, r.y, r.w, r.h);
    ctx.restore();
  } else {
    ctx.drawImage(sheet, r.s[1], r.s[2], r.s[3], r.s[4], r.x, r.y, r.w, r.h);
  }
  ctx.globalAlpha = 1;
}
const SHADOW_G = {};
function shadow(x, y, rx, ry, a) {
  let g = SHADOW_G[a];
  if (!g) {
    g = SHADOW_G[a] = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, 'rgba(8,20,6,' + a + ')'); g.addColorStop(0.6, 'rgba(8,20,6,' + a * 0.6 + ')'); g.addColorStop(1, 'rgba(8,20,6,0)');
  }
  ctx.save(); ctx.translate(x, y); ctx.scale(rx, ry);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.fill();
  ctx.restore();
}
function drawPlayer() {
  if (drawHero()) return;
  if (P.dead > 0 || !LIRA) return;
  if (P.running) {
    const rs = CH * 0.95 / RUN.stand;
    const rf = Math.floor((P.animT % RUN.cycle) / RUN.cycle * RUN.frames) % RUN.frames;
    ctx.drawImage(img.run, rf * RUN.w, P.row * RUN.h, RUN.w, RUN.h,
      P.x - RUN.ax * rs, P.y - RUN.ay * rs, RUN.w * rs, RUN.h * rs);
    return;
  }
  const key = P.dir === 'side' ? 'side' : 'front';
  const spec = META[key];
  let fi = 0;
  if (P.moving) fi = Math.floor((P.animT % spec.cycle) / spec.cycle * spec.frames) % spec.frames;
  const dw = spec.w * CH / spec.h, dh = CH;
  const breath = P.moving ? 1 : 1 + 0.008 * Math.sin(P.idleT * 2.2);
  ctx.save();
  ctx.translate(P.x, P.y);
  if (P.flip) ctx.scale(-1, 1);
  ctx.scale(1, breath);
  ctx.drawImage(img[key], fi * spec.w, 0, spec.w, spec.h, -dw / 2, -dh + dh * 0.015, dw, dh);
  ctx.restore();
}
const STICK_IMG = { joy: new Image(), knob: new Image() };
STICK_IMG.joy.src = 'ui/h_joy.webp' + V; STICK_IMG.knob.src = 'ui/h_knob.webp' + V;
function drawStickUI() {
  if (!('ontouchstart' in window) || !STICK_IMG.joy.complete || !STICK_IMG.knob.complete) return;
  const R = stickR(), h = stickHome(), x = stick.active ? stick.x0 : h.x, y = stick.active ? stick.y0 : h.y, m = R * 0.62;
  ctx.globalAlpha = stick.active ? 0.85 : 0.6;
  ctx.drawImage(STICK_IMG.joy, x - R, y - R, R * 2, R * 2);
  const k = R * 0.42, kx = x + stick.dx * m, ky = y + stick.dy * m;
  ctx.globalAlpha = stick.active ? 1 : 0.8;
  ctx.drawImage(STICK_IMG.knob, kx - k, ky - k, k * 2, k * 2);
  ctx.globalAlpha = 1;
}

// круглое пятно света цвета col (r,g,b): рисуется один раз, потом только масштабируется
const GLOW_IMG = {};
function glowImg(col) {
  if (GLOW_IMG[col]) return GLOW_IMG[col];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(' + col + ',1)'); gr.addColorStop(1, 'rgba(' + col + ',0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return (GLOW_IMG[col] = c);
}
// светлячки
const FLIES = [];
for (let i = 0; i < 70; i++) {
  FLIES.push({ x: WORLD_W * (0.05 + Math.random() * 0.9), y: WORLD_H * (0.1 + Math.random() * 0.75), p: Math.random() * 7, s: 0.4 + Math.random() * 0.8 });
}

const red = {};
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (loaded < TOTAL || !window.COMBAT_READY || !(HERO.ok || LIRA)) {
    ctx.fillStyle = '#0c1017'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#aab6c8'; ctx.font = '15px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Загрузка арены… ' + loaded + ' / ' + TOTAL, W / 2, H / 2);
    return;
  }
  // красные копии старых листов нужны, только если они есть на карте
  if (!red.done) { red.done = true; for (const k of ['s4', 's5']) if (img[k]) red[k] = makeRed(img[k]); }
  perfTick(dt);
  padPoll();

  // --- движение ---
  const paused = SHOP.paused;
  // онлайн: движение (с предсказанием) и бой ведёт сервер, см. net/client.js
  if (window.NETC && NETC.on) NETC.frame(dt, paused);
  else {
  let { ax, ay, m } = paused ? { ax: 0, ay: 0, m: 0 } : inputVector();
  if (P.dead > 0) { ax = 0; ay = 0; m = 0; }
  if (m > 0.12) P.face = { x: ax / m, y: ay / m };
  const sp = (P.ult > 0 ? 0.55 : 1) * (P.slowT > 0 ? P.slowK : 1) * (P.spdMul || 1) * CFG.units.hero.speed;   // во время бури героиня идёт медленнее
  P.moving = m > 0.12;
  // гистерезис, чтобы на границе шаг/бег анимация не дёргалась
  P.running = P.moving && m > (P.running ? RUN_AT - 0.1 : RUN_AT);
  if (P.running) {
    const k = RUN_SPEED * sp / m * dt;
    P.x += ax * k; P.y += ay * 0.72 * k;
    P.row = runRow(ax, ay);
    P.animT += dt; P.idleT = 0;
  } else if (P.moving) {
    P.x += ax * WALK_SPEED * 2 * dt; P.y += ay * WALK_SPEED * 2 * 0.72 * dt;
    if (Math.abs(ax) >= Math.abs(ay)) { P.dir = 'side'; P.flip = ax > 0; } else { P.dir = 'front'; }
    P.animT += dt * m * 2; P.idleT = 0;
  } else {
    P.idleT += dt;
  }
  collide();
  if (!paused) combatUpdate(dt); else SHOP.hud();
  }

  // --- камера ---
  const charScr = Math.max(90, Math.min(260, H * 0.28)) / CFG.cam;   // CFG.cam — отдаление из редактора
  // адрес с #map показывает всю арену целиком (для проверки расстановки)
  // камера не показывает больше арены, чем есть (на низких экранах иначе по бокам видны чёрные поля)
  const Z = location.hash === '#map' ? Math.min(W / WORLD_W, H / WORLD_H) : Math.max(charScr / CH, W / WORLD_W, H / WORLD_H);
  const vw = W / Z, vh = H / Z; cam.z = Z; cam.vw = vw; cam.vh = vh;
  let tx = P.x - vw / 2, ty = P.y - CH * 0.45 * CFG.units.hero.scale - vh / 2;
  tx = vw >= WORLD_W ? (WORLD_W - vw) / 2 : Math.max(0, Math.min(WORLD_W - vw, tx));
  ty = vh >= WORLD_H ? (WORLD_H - vh) / 2 : Math.max(0, Math.min(WORLD_H - vh, ty));
  if (!cam.ready) { cam.x = tx; cam.y = ty; cam.ready = true; }
  const f = 1 - Math.exp(-dt * 7);
  cam.x += (tx - cam.x) * f; cam.y += (ty - cam.y) * f;

  ctx.fillStyle = '#0d1a0c'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(DPR * Z, 0, 0, DPR * Z, -cam.x * DPR * Z, -cam.y * DPR * Z);
  ctx.imageSmoothingQuality = 'high';
  const seen = o => {
    const r = sprRect(o);
    return r.x < cam.x + vw + 160 && r.x + r.w > cam.x - 160 && r.y < cam.y + vh + 160 && r.y + r.h > cam.y - 160;
  };

  ctx.drawImage(img.ground, 0, 0, WORLD_W, WORLD_H);
  for (const o of FLAT) if (seen(o)) drawObj(o, red);
  combatGround(t);

  // тени
  for (const o of OBJ) {
    if (o.soft || o.baked || !seen(o)) continue;
    const s = SPR[o.s];
    const rx = o.r ? o.r[0] * 1.35 : s[3] * o.k * 0.42;
    shadow(o.x, o.y + 4, rx, rx * 0.38, 0.5);
  }
  if (P.dead <= 0) shadow(P.x, P.y, CH * 0.26 * CFG.units.hero.scale, CH * 0.075 * CFG.units.hero.scale, 0.6);

  // объекты и героиня по глубине; высокий объект становится прозрачнее, если героиня за ним
  const list = [];
  for (const o of OBJ) {
    if (!seen(o)) continue;
    const r = sprRect(o);
    const hide = !o.soft && r.h > 150 && P.y < o.y && P.y > r.y + 30 && Math.abs(P.x - o.x) < r.w * 0.42;
    o.a += ((hide ? 0.45 : 1) - o.a) * Math.min(1, dt * 9);
    list.push(o);
  }
  list.push(P);
  for (const e of combatEntities()) list.push(e);
  list.sort((a, b) => a.y - b.y);
  for (const o of list) { if (o === P) drawPlayer(); else if (o.draw) o.draw(); else drawObj(o, red); }

  // свечение огня, рун и кристаллов
  ctx.globalCompositeOperation = 'lighter';
  for (const o of OBJ) {
    const gl = GLOW[o.s];
    if (!gl || !seen(o)) continue;
    const r = sprRect(o);
    const col = (o.red && o.s === 'shrine') ? '255,90,60' : gl[0];
    const fl = 1 + gl[3] * (0.12 * Math.sin(t * 9 + o.x) + 0.08 * Math.sin(t * 23 + o.y));
    const rad = gl[2] * fl, gy = r.y + r.h * gl[1];
    const pulse = gl[3] < 1 ? 0.75 + 0.25 * Math.sin(t * 1.6 + o.x * 0.01) : 1;
    ctx.globalAlpha = 0.42 * pulse;
    ctx.drawImage(glowImg(col), o.x - rad, gy - rad, rad * 2, rad * 2);
  }
  const flyImg = glowImg('230,255,150');
  for (const fl of FLIES) {
    const x = fl.x + Math.sin(t * 0.5 * fl.s + fl.p) * 40, y = fl.y + Math.cos(t * 0.37 * fl.s + fl.p * 2) * 26;
    if (x < cam.x - 20 || x > cam.x + vw + 20 || y < cam.y - 20 || y > cam.y + vh + 20) continue;
    const a = 0.35 + 0.35 * Math.sin(t * 2.2 * fl.s + fl.p * 3);
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.drawImage(flyImg, x - 9, y - 9, 18, 18);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  for (const o of FRONT) if (seen(o)) drawObj(o, red);
  combatOver(t);

  // --- поверх мира: затемнение краёв и стик ---
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!VIG) {
    VIG = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.5, W / 2, H / 2, Math.max(W, H) * 0.8);
    VIG.addColorStop(0, 'rgba(0,0,0,0)'); VIG.addColorStop(1, 'rgba(0,0,0,0.38)');
  }
  ctx.fillStyle = VIG; ctx.fillRect(0, 0, W, H);
  combatUI();
  drawStickUI();
}
requestAnimationFrame(frame);
</script>
